# Render Free — testing only. No paid disk.
# WARNING: SQLite users/credits and uploaded videos disappear on server recycle.
services:
  - type: web
    name: shortmint-studio
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SHORTMINT_STORAGE_DIR
        value: /app/storage-data
      - key: OWNER_USERNAME
        sync: false
      - key: OWNER_PASSWORD
        sync: false
