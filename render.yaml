# ShortMint v27: PostgreSQL is mandatory for hosted user/credit persistence.
# Set DATABASE_URL in Render Environment BEFORE deploying.
# Render Free storage still does NOT preserve uploaded videos or exported MP4s.
services:
  - type: web
    name: shortmint-studio
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SHORTMINT_STORAGE_DIR
        value: /app/storage-data
      - key: REQUIRE_PERSISTENT_DB
        value: '1'
      - key: DATABASE_URL
        sync: false
      - key: OWNER_USERNAME
        sync: false
      - key: OWNER_PASSWORD
        sync: false

      # v41: verified-email migration for previous Google-only users
      - key: RESEND_API_KEY
        sync: false
      - key: SHORTMINT_FROM_EMAIL
        sync: false
      - key: SHORTMINT_RECOVERY_SECRET
        generateValue: true
